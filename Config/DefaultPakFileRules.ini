; Rules are applied in order, the first matching rule wins. See Engine/Config/BasePakFileRules.ini for the syntax.

[HololivePlush_ExcludeSkeletal]
; SkeletalMesh / Skeleton / PhysicsAsset de HololivePlush : exclus de tous les paks (dont pakchunk101).
; Rien ne les reference : les BP utilisent les meshes *Static.
; bOverrideChunkManifest est obligatoire en build chunke, sinon la regle est ignoree.
bExcludeFromPaks=true
bOverrideChunkManifest=true
; Skeleton + PhysicsAsset (suffixe systematique)
+Files=".../Content/Mods/HololivePlush/.../*_Skeleton.*"
+Files=".../Content/Mods/HololivePlush/.../*_PhysicsAsset.*"
; SkeletalMesh (pas de suffixe -> liste explicite, a completer pour chaque nouveau SkeletalMesh)
+Files=".../Content/Mods/HololivePlush/Amelia/amelia.*"
